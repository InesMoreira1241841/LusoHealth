<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LusoHealth</title>
    <link rel="stylesheet" href="../../assets/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../../assets/fontawesome/all.min.css">
    <link rel="stylesheet" href="../../assets/css/1241841.css">
</head>

<body class="bg-page-light">

    <header class="container-fluid bg-white border-bottom p-3 shadow-sm">
        <div class="row align-items-center">
            <div class="col-6 d-flex align-items-center">
                <i class="fa-solid fa-microscope fa-2xl me-3 icon-brand-clinical"></i>
                <h3 class="mb-0 fw-bold text-dark">LusoHealth <span class="fs-6 text-muted fw-normal">| Gestão de
                        Inventário</span></h3>
            </div>

            <div class="col-6 text-end">
                <div class="dropdown d-inline-block">
                    <button
                        class="btn btn-light border dropdown-toggle p-2 rounded-pill fw-medium d-flex align-items-center gap-2 ms-auto"
                        type="button" id="userMenu" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fa-solid fa-user-gear text-success"></i>
                        <span>Engenharia Biomédica</span>
                    </button>

                    <ul class="dropdown-menu dropdown-menu-end shadow-sm border-light-subtle mt-2 custom-card-rounded"
                        aria-labelledby="userMenu">
                        <li>
                            <h6 class="dropdown-header small text-uppercase fw-bold text-muted">Utilizador Atual</h6>
                        </li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li>
                            <a class="dropdown-menu-item text-danger d-flex align-items-center gap-2 px-3 py-2 text-decoration-none small"
                                href="../../login.html">
                                <i class="fa-solid fa-right-from-bracket"></i>
                                <span class="fw-medium">Terminar Sessão</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </header>

    <div class="container-fluid mt-4">
        <div class="row g-4">
            <aside class="col-md-3 col-lg-2">
                <div
                    class="bg-white p-3 shadow-sm border border-light-subtle main-container-height custom-card-rounded">
                    <h6 class="fw-bold text-muted small text-uppercase px-2 mb-3">Navegação</h6>
                    <nav class="nav flex-column gap-1">
                        <a class="nav-link text-secondary fw-medium px-3 py-2 rounded-3" href="../../index.html"><i
                                class="fa-solid fa-chart-line me-2"></i>Dashboard</a>
                        <a class="nav-link text-secondary fw-medium px-3 py-2 rounded-3"
                            href="../equipamentos/equipamentos.html"><i class="fa-solid fa-heart-pulse me-2"></i>Equipamentos</a>
                        <a class="nav-link text-secondary fw-medium px-3 py-2 rounded-3"
                            href="../localizacoes/localizacoes.html"><i
                                class="fa-solid fa-hospital-user me-2"></i>Localizações</a>
                        <a class="nav-link fw-bold px-3 py-2 rounded-3 text-success bg-success-subtle"
                            href="../fornecedores/fornecedores.html"><i
                                class="fa-solid fa-truck-field me-2"></i>Fornecedores</a>
                        <a class="nav-link text-secondary fw-medium px-3 py-2 rounded-3"
                            href="../documentacao/documentos.html"><i
                                class="fa-solid fa-file-pdf me-2"></i>Documentação</a>
                        <a class="nav-link text-secondary fw-medium px-3 py-2 rounded-3"
                            href="../garantias/contratos.html"><i
                                class="fa-solid fa-file-contract me-2"></i>Garantias</a>
                    </nav>
                </div>
            </aside>

            <main class="col-md-9 col-lg-10">
                <div
                    class="bg-white p-4 shadow-sm border border-light-subtle main-container-height custom-card-rounded">

                    <div class="mb-4 pb-2 border-bottom">
                        <h2 class="fw-bold text-dark m-0">Registar Fornecedor / Fabricante</h2>
                        <p class="text-muted small m-0">Insira os dados da entidade externa para vinculação a
                            equipamentos e contratos.</p>
                    </div>

                    <form action="fornecedores.html" method="POST" class="row g-3 fw-medium text-secondary small">
                        <div class="col-md-6">
                            <label for="nome_fornecedor" class="form-label text-dark">Nome / Razão Social</label>
                            <input type="text" id="nome_fornecedor" name="nome" class="form-control rounded-3" required
                                placeholder="Ex: Siemens Healthineers Portugal">
                        </div>

                        <div class="col-md-6">
                            <label for="nif_fornecedor" class="form-label text-dark">NIF (Número de Identificação
                                Fiscal)</label>
                            <input type="text" id="nif_fornecedor" name="nif" class="form-control rounded-3" required
                                placeholder="Ex: 500123456">
                        </div>

                        <div class="col-md-6">
                            <label for="telefone_fornecedor" class="form-label text-dark">Telefone Geral da
                                Empresa</label>
                            <input type="tel" id="telefone_fornecedor" name="telefone" class="form-control rounded-3"
                                required placeholder="Ex: +351 210 000 000">
                        </div>

                        <div class="col-md-6">
                            <label for="email_fornecedor" class="form-label text-dark">E-mail de Assistência
                                Oficial</label>
                            <input type="email" id="email_fornecedor" name="email" class="form-control rounded-3"
                                required placeholder="Ex: suporte@empresa.com">
                        </div>

                        <div class="col-md-12">
                            <label for="morada_fornecedor" class="form-label text-dark">Endereço da Sede
                                Comercial</label>
                            <input type="text" id="morada_fornecedor" name="morada" class="form-control rounded-3"
                                placeholder="Rua, Código Postal, Cidade">
                        </div>

                        <div class="col-md-6 mt-4 pt-2">
                            <label for="tecnico_responsavel" class="form-label text-dark fw-bold text-success">
                                <i class="fa-solid fa-user-gear me-2"></i>Gestor de Conta / Técnico Responsável
                            </label>
                            <input type="text" id="tecnico_responsavel" name="tecnico_nome"
                                class="form-control rounded-3" required
                                placeholder="Ex: Eng. Carlos Mendes (Biomédica)">
                        </div>

                        <div class="col-md-6 mt-4 pt-2">
                            <label for="telefone_tecnico" class="form-label text-dark fw-bold text-success">
                                <i class="fa-solid fa-phone-volume me-2"></i>Linha Direta do Técnico
                            </label>
                            <input type="tel" id="telefone_tecnico" name="tecnico_telefone"
                                class="form-control rounded-3" required placeholder="Ex: +351 912 345 678">
                        </div>

                        <div class="col-12 mt-4 pt-3 border-top d-flex gap-2 justify-content-end">
                            <a href="fornecedores.html" class="btn btn-light border rounded-pill px-4">Cancelar</a>
                            <button type="submit" class="btn btn-success rounded-pill px-4">
                                <i class="fa-solid fa-floppy-disk me-2"></i>Guardar Fornecedor
                            </button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <script src="../../assets/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/1241841.js"></script>
</body>

</html>
