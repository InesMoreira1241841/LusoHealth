<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LusoHealth</title>
    <link rel="stylesheet" href="../../assets/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../../assets/fontawesome/all.min.css">
    <link rel="stylesheet" href="../../assets/css/1241841.css">
</head>

<body class="bg-page-light">

    <header class="container-fluid bg-white border-bottom p-3 shadow-sm">
        <div class="row align-items-center">
            <div class="col-6 d-flex align-items-center">
                <i class="fa-solid fa-microscope fa-2xl me-3 icon-brand-clinical"></i>
                <h3 class="mb-0 fw-bold text-dark">LusoHealth <span class="fs-6 text-muted fw-normal">| Gestão de Inventário</span></h3>
            </div>

            <div class="col-6 text-end">
                <div class="dropdown d-inline-block">
                    <button class="btn btn-light border dropdown-toggle p-2 rounded-pill fw-medium d-flex align-items-center gap-2 ms-auto"
                        type="button" id="userMenu" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fa-solid fa-user-gear text-success"></i>
                        <span>Engenharia Biomédica</span>
                    </button>

                    <ul class="dropdown-menu dropdown-menu-end shadow-sm border-light-subtle mt-2 custom-card-rounded"
                        aria-labelledby="userMenu">
                        <li>
                            <h6 class="dropdown-header small text-uppercase fw-bold text-muted">Utilizador Atual</h6>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <a class="dropdown-menu-item text-danger d-flex align-items-center gap-2 px-3 py-2 text-decoration-none small"
                                href="../../login.html">
                                <i class="fa-solid fa-right-from-bracket"></i>
                                <span class="fw-medium">Terminar Sessão</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </header>

    <div class="container-fluid mt-4">
        <div class="row g-4">
            <aside class="col-md-3 col-lg-2">
                <div class="bg-white p-3 shadow-sm border border-light-subtle main-container-height custom-card-rounded">
                    <h6 class="fw-bold text-muted small text-uppercase px-2 mb-3">Navegação</h6>
                    <nav class="nav flex-column gap-1">
                        <a class="nav-link text-secondary fw-medium px-3 py-2 rounded-3" href="../../index.html"><i
                                class="fa-solid fa-chart-line me-2"></i>Dashboard</a>
                        <a class="nav-link text-secondary fw-medium px-3 py-2 rounded-3"
                            href="../equipamentos/equipamentos.html"><i class="fa-solid fa-heart-pulse me-2"></i>Equipamentos</a>
                        <a class="nav-link text-secondary fw-medium px-3 py-2 rounded-3"
                            href="../localizacoes/localizacoes.html"><i class="fa-solid fa-hospital-user me-2"></i>Localizações</a>
                        <a class="nav-link text-secondary fw-medium px-3 py-2 rounded-3"
                            href="../fornecedores/fornecedores.html"><i class="fa-solid fa-truck-field me-2"></i>Fornecedores</a>
                        <a class="nav-link fw-bold px-3 py-2 rounded-3 text-success bg-success-subtle"
                            href="documentos.html"><i class="fa-solid fa-file-pdf me-2"></i>Documentação</a>
                        <a class="nav-link text-secondary fw-medium px-3 py-2 rounded-3"
                            href="../garantias/contratos.html"><i class="fa-solid fa-file-contract me-2"></i>Garantias</a>
                    </nav>
                </div>
            </aside>

            <main class="col-md-9 col-lg-10">
                <div class="bg-white p-4 shadow-sm border border-light-subtle main-container-height custom-card-rounded">
                    
                    <div class="mb-4 pb-2 border-bottom d-flex justify-content-between align-items-center">
                        <div>
                            <h2 class="fw-bold text-dark m-0">Vincular Novo Documento Técnico</h2>
                            <p class="text-muted small m-0">Adicione manuais ou relatórios, mapeando-os diretamente ao inventário físico.</p>
                        </div>
                        <a href="documentos.html" class="btn btn-light border btn-sm rounded-pill px-3 fw-medium">
                            <i class="fa-solid fa-arrow-left me-2"></i>Voltar
                        </a>
                    </div>

                    <form action="documentos.html" method="POST" enctype="multipart/form-data" id="formNovoDocumento" name="form_novo_documento" class="row g-3 fw-medium text-secondary small">
                        
                        <div class="col-md-6">
                            <label for="tipoDocumento" class="form-label text-dark fw-bold">Tipo de Documento</label>
                            <select class="form-select text-secondary" id="tipoDocumento" name="tipo_documento" required>
                                <option value="" selected disabled>Selecione a tipologia...</option>
                                <option value="Manual_Utilizador">Manual do Utilizador</option>
                                <option value="Manual_Tecnico">Manual de Serviço / Técnico</option>
                                <option value="Certificado_Calibracao">Certificado de Calibração / Metrologia</option>
                                <option value="Declaracao_CE">Declaração de Conformidade CE</option>
                                <option value="Relatorio_Intervencao">Relatório Técnico de Intervenção</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="equipamentoAlvo" class="form-label text-dark fw-bold">Equipamento Associado</label>
                            <select class="form-select text-secondary" id="equipamentoAlvo" name="equipamento_alvo" required>
                                <option value="" selected disabled>Vincular ao código de inventário...</option>
                                <option value="INV-0091">#INV-0091 - Ventilador Pulmonar (Dräger)</option>
                                <option value="INV-1102">#INV-1102 - Desfibrilhador R Series (Zoll)</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="dataEmissao" class="form-label text-dark fw-bold">Data de Emissão / Upload</label>
                            <input type="date" class="form-control text-secondary" id="dataEmissao" name="data_emissao" required>
                        </div>

                        <div class="col-md-6">
                            <label for="dataValidade" class="form-label text-dark fw-bold">Data de Validade (Se aplicável)</label>
                            <input type="date" class="form-control text-secondary" id="dataValidade" name="data_validade">
                        </div>

                        <div class="col-md-12">
                            <label for="ficheiroDocumento" class="form-label text-dark fw-bold">Ficheiro Digital (Apenas PDF de acordo com as normas)</label>
                            <input type="file" class="form-control text-secondary" id="ficheiroDocumento" name="ficheiro_documento" accept=".pdf" required>
                        </div>

                        <div class="col-12 mt-4 pt-3 border-top d-flex gap-2 justify-content-end">
                            <a href="documentos.html" class="btn btn-light border rounded-pill px-4 fw-medium">Voltar</a>
                            <button type="submit" id="btnCarregarDocumento" class="btn btn-success rounded-pill px-4 fw-medium shadow-sm">
                                <i class="fa-solid fa-cloud-arrow-up me-2"></i>Carregar Documento
                            </button>
                        </div>
                    </form>

                </div>
            </main>
        </div>
    </div>

    <script src="../../assets/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/1241841.js"></script>
</body>

</html>
